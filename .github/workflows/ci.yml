name: Pull request checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:integration
      - run: npm run build
      - run: node scripts/check-worker-test-isolation.mjs
      - run: npm run check:docs
      - name: Install Chromium for foundation smoke
        run: npx playwright install --with-deps chromium
      - run: npm run test:smoke
      - run: npm run test:auth-smoke
      - run: npm run test:connected-smoke
      - run: npm run test:e2e
      - name: Upload sanitized browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-regression-failure
          path: test-results/connected-regression/
          if-no-files-found: ignore
          retention-days: 7
